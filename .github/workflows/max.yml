name: fixtv

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Çift yayın çalışmasını ve çakışmayı önleyen kural
concurrency:
  group: fixtv-stream
  cancel-in-progress: true

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
    - name: 📥 Depoyu klonla
      uses: actions/checkout@v4

    - name: 🐍 Python kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # --- FFMPEG 9.0.2'Yİ SABİT OLARAK KURAN ADIM ---
    - name: 📦 FFmpeg 9.0.2 Kurulumu (Sabit Sürüm)
      run: |
        set -e
        FFMPEG_VERSION="9.0.2"
        BUILD_NAME="ffmpeg-n${FFMPEG_VERSION}-linux64-gpl-9.0"
        echo "🔧 FFmpeg ${FFMPEG_VERSION} indiriliyor..."
        wget -q "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${BUILD_NAME}.tar.xz" -O ffmpeg.tar.xz
        tar -xf ffmpeg.tar.xz
        sudo mv "${BUILD_NAME}/bin/ffmpeg"  /usr/local/bin/ffmpeg
        sudo mv "${BUILD_NAME}/bin/ffprobe" /usr/local/bin/ffprobe
        sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
        echo "✅ FFmpeg kuruldu:"
        ffmpeg -version | head -1

    - name: 🛠️ Diğer Bağımlılıklar (OpenSSL / Ca-certificates & Pip)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ca-certificates openssl
        pip install requests

    - name: 🔍 FFmpeg Sürümünü Kontrol Et (9.0.2 Bekleniyor)
      run: |
        set -e
        FFMPEG_VERSION=$(ffmpeg -version | head -1 | sed -n 's/.*ffmpeg version \([^ ]*\).*/\1/p')
        FFPROBE_VERSION=$(ffprobe -version | head -1 | sed -n 's/.*ffprobe version \([^ ]*\).*/\1/p')
        echo "Tespit edilen ffmpeg : ${FFMPEG_VERSION}"
        echo "Tespit edilen ffprobe: ${FFPROBE_VERSION}"
        if [ "${FFMPEG_VERSION}" != "9.0.2" ]; then
          echo "❌ Beklenen FFmpeg 9.0.2, tespit edilen: ${FFMPEG_VERSION}"
          exit 1
        fi
        echo "✅ FFmpeg 9.0.2 doğrulandı."

    - name: 📥 Kayıtlı State Dosyasını İndir
      continue-on-error: true
      run: |
        curl -sL https://github.com/${{ github.repository }}/releases/download/state-data/state_fixtv.json -o state_fixtv.json

    - name: 🚀 Yayını başlat
      env:
        STATE_FILE_NAME: "state_fixtv.json"
        STRICT_FFMPEG: "1"
      run: python -u maxdeneme.py

    - name: 💾 Son Durumu Release Üzerinde Güncelle
      if: always()
      uses: softprops/action-gh-release@v1
      with:
        files: state_fixtv.json
        tag_name: state-data
        name: "Yayın Kaldığı Yer (State)"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔁 Süre Doldu veya İptal Edildi, Yeni Run'ı Tetikle
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        curl -X POST \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/maxdeneme.yml/dispatches" \
          -d '{"ref":"main"}'
